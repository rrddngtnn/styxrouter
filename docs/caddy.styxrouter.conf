# StyxRouter — add to /etc/caddy/Caddyfile
#
# Prerequisite: DNS A record  styx.example.com  →  192.0.2.20
#
# Install (administrator; review before applying):
#   1. append this block to /etc/caddy/Caddyfile
#   2. sudo caddy validate --config /etc/caddy/Caddyfile
#   3. sudo systemctl reload caddy
#   4. verify:  curl -sS https://styx.example.com/api/health
#      expected: {"ok":true,"host":"hono-bun","version":"styx-0.1"}
#
# Rollback: remove the block, reload caddy. Styx keeps running on :20128 either way.

styx.example.com {
	# Caddy handles TLS automatically via Let's Encrypt HTTP-01 challenge
	# on port 80. Make sure the firewall allows 80 + 443 inbound.

	encode zstd gzip

	# Buffer streaming SSE/chunked for /v1/chat/completions.
	# Caddy's default reverse_proxy already flushes streams; this is just
	# for clarity + explicit buffer sizing on SSE.
	reverse_proxy 127.0.0.1:20128 {
		flush_interval -1
		header_up Host {host}
		header_up X-Real-IP {remote_host}
		header_up X-Forwarded-For {remote_host}
		header_up X-Forwarded-Proto {scheme}

		# Allow long-lived streams up to 10 minutes (model dispatch, SSE)
		transport http {
			read_timeout 600s
			response_header_timeout 60s
		}
	}

	log {
		output file /var/log/caddy/styx-access.log {
			roll_size 10MiB
			roll_keep 3
		}
		format json
	}
}

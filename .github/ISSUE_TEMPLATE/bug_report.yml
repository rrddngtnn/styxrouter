name: Bug report
description: Report a reproducible problem
labels: []
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting process in SECURITY.md, not this form. Remove credentials and personal or deployment details from reports.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example and sanitized logs if useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Commit or version, OS, Bun and Node versions.
    validations:
      required: true

name: Docker verify & publish GHCR

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified image to GHCR (main only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build-only, then isolated image smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve application image version
        id: image-version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="sha-$GITHUB_SHA"
          if [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            [[ "$RELEASE_NAME" =~ ^v[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]] || exit 1
            (( ${#RELEASE_NAME} <= 128 )) || exit 1
            version="$RELEASE_NAME"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'created=%s\n' "$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build only (no registry login or push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: styxrouter:verify
          build-args: |
            STYX_VERSION=${{ steps.image-version.outputs.version }}
            STYX_REVISION=${{ github.sha }}
            STYX_CREATED=${{ steps.image-version.outputs.created }}
          labels: |
            org.opencontainers.image.title=StyxRouter
            org.opencontainers.image.version=${{ steps.image-version.outputs.version }}
            org.opencontainers.image.source=https://github.com/rrddngtnn/styxrouter
            org.opencontainers.image.revision=${{ github.sha }}
          # This is a single tested image, not an untested multi-arch rebuild.
          provenance: false
      - name: Health, built panel, no-key auth and byte-exact notices
        run: python3 scripts/docker-smoke.py styxrouter:verify
      - name: Export the exact verified image
        if: github.event_name != 'pull_request'
        run: docker save styxrouter:verify -o "$RUNNER_TEMP/styxrouter.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: verified-docker-image
          path: ${{ runner.temp }}/styxrouter.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish verified image to GHCR
    needs: verify
    # Docker publication is intentionally independent from npm publication.
    # Package visibility is never changed by this workflow.
    if: >-
      github.repository == 'rrddngtnn/styxrouter' &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/rrddngtnn/styxrouter
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check repository visibility
        env:
          GH_REPO: rrddngtnn/styxrouter
        run: |
          set -euo pipefail
          test "$(gh api repos/rrddngtnn/styxrouter --jq '.visibility')" = public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-docker-image
          path: ${{ runner.temp }}/verified
      - name: Load and tag exact verified image (no rebuild)
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/verified/styxrouter.tar"
          tags=("$IMAGE:sha-$GITHUB_SHA")
          if [[ "$RELEASE_REF" == refs/heads/main ]]; then
            tags+=("$IMAGE:latest")
          elif [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            [[ "$RELEASE_NAME" =~ ^v[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]] || { printf 'Invalid Docker release tag\n' >&2; exit 1; }
            (( ${#RELEASE_NAME} <= 128 )) || exit 1
            tags+=("$IMAGE:$RELEASE_NAME")
          fi
          printf '%s\n' "${tags[@]}" > "$RUNNER_TEMP/image-tags"
          for tag in "${tags[@]}"; do docker tag styxrouter:verify "$tag"; done
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified tags and verify registry digest
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker push "$tag"
            docker pull "$tag"
            test "$(docker image inspect --format '{{.Id}}' "$tag")" = \
              "$(docker image inspect --format '{{.Id}}' styxrouter:verify)"
          done < "$RUNNER_TEMP/image-tags"
      - name: Report package visibility without changing it
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" \
            --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/users/rrddngtnn/packages/container/styxrouter)
          case "$status" in
            200) visibility=$(jq -r '.visibility' "$RUNNER_TEMP/package.json") ;;
            403) visibility=unavailable-with-actions-token ;;
            *) printf 'Cannot read package visibility (HTTP %s)\n' "$status" >&2; exit 1 ;;
          esac
          printf 'Published verified linux/amd64 image to GHCR; package visibility remains %s; npm disabled.\n' "$visibility" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r tag; do printf -- '- `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"; done < "$RUNNER_TEMP/image-tags"

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure runner scratch directory
        # The runner context is available in steps, not job-level env.
        run: printf 'TMPDIR=%s\n' '${{ runner.temp }}' >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install Caddy for reverse-proxy integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends caddy
          caddy version
      - name: Server tests (isolated)
        run: bun run server:test
      - name: Server Python tests
        run: bun run server:test:py
      - name: Panel tests
        run: bun run panel:test
      - name: Panel typecheck
        run: bun run panel:typecheck
      - name: Panel build
        run: bun run panel:build
      - name: Hygiene gate tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Server tests (isolated)
        run: bun run server:test
      - name: Server Python tests
        run: bun run server:test:py
      - name: Panel tests
        run: bun run panel:test
      - name: Panel typecheck
        run: bun run panel:typecheck
      - name: Panel build
        run: bun run panel:build
      - name: Hygiene gate tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

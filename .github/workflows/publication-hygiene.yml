name: Publication hygiene

on:
  workflow_dispatch:
    inputs:
      run_runtime:
        description: 'Run the separately-authorized runtime hygiene gate'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Full private-catalog hygiene gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Catalog stays base64 UTF-8; allowlist optionally uses additive gzip+base64.
    # They are deliberately not available to pull requests or ordinary CI.
    environment: publication-hygiene
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build production panel
        run: bun run panel:build
      - name: Materialize protected scanner inputs in runner scratch
        env:
          PRIVATE_CATALOG_B64: ${{ secrets.HYGIENE_PRIVATE_CATALOG_B64 }}
          PRIVATE_ALLOWLIST_B64: ${{ secrets.HYGIENE_PRIVATE_ALLOWLIST_B64 }}
          # Maintenance bindings are isolated; preserve the newer main lineage secret.
          PRIVATE_ALLOWLIST_GZIP_B64: ${{ secrets[(github.ref == 'refs/heads/maintenance/v0.1.x' || github.ref == 'refs/tags/v0.1.6') && 'HYGIENE_MAINTENANCE_V016_ALLOWLIST_GZIP_B64' || 'HYGIENE_PRIVATE_ALLOWLIST_GZIP_B64'] }}
        run: python3 scripts/materialize-hygiene-inputs.py
      - name: Run authoritative offline hygiene gates
        run: |
          set -euo pipefail
          python3 scripts/public-hygiene-gate.py \
            --repo-root . \
            --panel-dist-dir apps/panel/dist \
            --allow-runtime-skip \
            --allowlist scripts/hygiene_allowlist.json \
            --private-patterns "$RUNNER_TEMP/hygiene_private.py" \
            --private-allowlist "$RUNNER_TEMP/hygiene_private_allowlist.json"
      - name: Run separately-authorized runtime hygiene gate
        if: inputs.run_runtime
        env:
          HYGIENE_RUNTIME_URL: ${{ secrets.HYGIENE_RUNTIME_URL }}
          HYGIENE_RUNTIME_TOKEN: ${{ secrets.HYGIENE_RUNTIME_TOKEN }}
        run: |
          set -euo pipefail
          : "${HYGIENE_RUNTIME_URL:?missing HYGIENE_RUNTIME_URL}"
          : "${HYGIENE_RUNTIME_TOKEN:?missing HYGIENE_RUNTIME_TOKEN}"
          python3 scripts/public-hygiene-gate.py \
            --repo-root . \
            --panel-dist-dir apps/panel/dist \
            --runtime-url "$HYGIENE_RUNTIME_URL" \
            --auth-token "$HYGIENE_RUNTIME_TOKEN" \
            --allowlist scripts/hygiene_allowlist.json \
            --private-patterns "$RUNNER_TEMP/hygiene_private.py" \
            --private-allowlist "$RUNNER_TEMP/hygiene_private_allowlist.json"
      - name: Report runtime hygiene state
        if: ${{ !inputs.run_runtime }}
        run: |
          printf '%s\n' 'Runtime hygiene: SKIPPED — no runtime endpoint or token was supplied; this workflow cleared only the authoritative offline static, history, bundle, and private-catalog gates.' >> "$GITHUB_STEP_SUMMARY"

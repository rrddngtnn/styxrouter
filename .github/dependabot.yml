version: 2
updates:
  # Workspace dependencies are resolved by the single root bun.lock. The npm
  # ecosystem would update package.json without bun.lock and fail CI's
  # frozen-lockfile install.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Vite 8 (Rolldown) needs a manualChunks config change; upgrade manually.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    groups:
      panel-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
